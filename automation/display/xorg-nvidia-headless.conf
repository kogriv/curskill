# Второй X-сервер на видеокарте без монитора — экран стенда Cursor.
# BusID ниже — заглушка. curskill-xorg переписывает его из lspci перед стартом.
# Без обёртки этот конфиг не привязан к конкретной карте.

Section "ServerFlags"
    Option "AutoAddGPU"     "off"
    Option "AutoAddDevices" "off"
    Option "DontVTSwitch"   "on"
    Option "DontZap"        "on"
EndSection

Section "Device"
    Identifier "nvidia"
    Driver     "nvidia"
    BusID      "PCI:0:0:0"
    Option     "AllowEmptyInitialConfiguration" "true"
EndSection

Section "Monitor"
    Identifier "virt"
EndSection

Section "Screen"
    Identifier "Screen0"
    Device     "nvidia"
    Monitor    "virt"
    Option     "UseDisplayDevice" "None"
    DefaultDepth 24
    SubSection "Display"
        Depth   24
        Virtual 1920 1080
    EndSubSection
EndSection

Section "ServerLayout"
    Identifier "Layout0"
    Screen     "Screen0"
EndSection
